[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dsh-factor-mining"
version = "0.1.0"
description = "Portable factor-mining engine and JSON-RPC bridge for the DeepSeek Harness factor-mining plugin."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["../LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "dsh-factor-mining contributors" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=14.0",
  # 效率编译层（2026-09-01）：自动 njit 加速。代码侧惰性 import、缺失时
  # 优雅降级（烟测门只跳过 njit 探针，评估照常）——但完整能力需要它。
  "numba>=0.61",
]

[project.scripts]
dsh-factor-mining-bridge = "dsh_factor_mining.bridge:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_factor_mining", "src/dsh_strategy_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: 真实超时等待类测试（烟测门死循环探针等，默认随全量跑）",
]
